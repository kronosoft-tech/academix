name: Build and Release

on:
  push:
    branches:
      - main
      - develop
      - release
    # Package-hosting commits (see host-store-package job) must not
    # retrigger the full desktop build matrix.
    paths-ignore:
      - "web/public/downloads/**"
    tags:
      - "app-v*"
  pull_request:
    branches:
      - main
      - develop
      - release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
          # Linux (x64 only)
          - platform: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu"
            rust-targets: "x86_64-unknown-linux-gnu"
          # Windows
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            rust-targets: "x86_64-pc-windows-msvc"
          - platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            rust-targets: "aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun (Linux/macOS)
        if: matrix.platform != 'windows-latest'
        run: curl -fsSL https://bun.sh/install | bash && echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Setup Bun (Windows)
        if: matrix.platform == 'windows-latest'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.rust-targets }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Academix v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Microsoft Store MSI/EXE submissions need a versioned, direct-download
  # URL with no redirects. This job copies the Windows x64 installer from
  # the freshly published release into web/public/downloads/v<version>/,
  # which Vercel then serves straight from its edge CDN at
  # https://<domain>/downloads/v<version>/academix_<version>_x64-setup.exe
  host-store-package:
    name: Host Store package (web/public/downloads)
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download Windows x64 installer from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          gh release download "app-v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "academix_${VERSION}_x64-setup.exe" \
            --clobber
          mkdir -p "web/public/downloads/v${VERSION}"
          mv "academix_${VERSION}_x64-setup.exe" "web/public/downloads/v${VERSION}/"

      - name: Commit hosted package
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "web/public/downloads/v${VERSION}"
          if git diff --cached --quiet; then
            echo "Package already hosted, nothing to commit"
          else
            git commit -m "chore(web): host v${VERSION} windows x64 installer for Store"
            git push
          fi
